<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whisper — Leave a Note</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Poppins:wght@300;400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Poppins', sans-serif;
    background: #faf7f2;
    min-height: 100vh;
    padding: 60px 20px;
    color: #2b2b2b;
  }

  .wrap {
    max-width: 560px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 45px;
  }

  header span {
    font-size: 12px;
    letter-spacing: 4px;
    color: #a08654;
    text-transform: uppercase;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 42px;
    font-weight: 600;
    margin: 12px 0 10px;
  }

  header p {
    font-size: 14px;
    color: #8a8a8a;
  }

  .card {
    background: #fffdfa;
    border: 1px solid #e8e0d3;
    border-radius: 4px;
    padding: 30px;
    margin-bottom: 40px;
  }

  .card label {
    display: block;
    font-size: 12px;
    letter-spacing: 1px;
    color: #8a6d3b;
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  .card input, .card textarea {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 20px;
    border: 1px solid #e0d8c8;
    border-radius: 3px;
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    background: #fdfbf7;
    resize: none;
  }

  .card input:focus, .card textarea:focus {
    outline: none;
    border-color: #8a6d3b;
  }

  .card textarea { height: 90px; }

  .card button {
    width: 100%;
    background: #8a6d3b;
    color: #fff;
    border: none;
    padding: 14px;
    letter-spacing: 1px;
    font-size: 13px;
    text-transform: uppercase;
    cursor: pointer;
    transition: 0.3s;
    border-radius: 3px;
  }

  .card button:hover { background: #6e5730; }

  .error {
    color: #b04a3a;
    font-size: 13px;
    margin: -10px 0 15px;
    display: none;
  }

  .divider {
    text-align: center;
    color: #d8cdb8;
    font-family: 'Playfair Display', serif;
    margin-bottom: 30px;
    letter-spacing: 4px;
  }

  .note {
    background: #fffdfa;
    border-left: 2px solid #8a6d3b;
    padding: 16px 20px;
    margin-bottom: 16px;
  }

  .note .name {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    color: #2b2b2b;
    margin-bottom: 4px;
  }

  .note .text {
    font-size: 14px;
    color: #555;
    line-height: 1.7;
    margin-bottom: 8px;
  }

  .note .time {
    font-size: 11px;
    color: #b0a894;
    letter-spacing: 0.5px;
  }

  .empty {
    text-align: center;
    color: #b0a894;
    font-size: 14px;
    padding: 30px 0;
    font-style: italic;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span>A quiet corner</span>
    <h1>Whisper</h1>
    <p>Leave a thought, a memory, or a hello.</p>
  </header>

  <div class="card">
    <label>Your name</label>
    <input id="name" placeholder="e.g. Meera">
    <label>Your note</label>
    <textarea id="text" placeholder="Write something..."></textarea>
    <p class="error" id="err">Please fill in both fields.</p>
    <button onclick="sendMsg()">Leave a whisper</button>
  </div>

  <p class="divider">✦ ✦ ✦</p>

  <div id="list"></div>
</div>

<script>
async function loadMsgs() {
  const res = await fetch('/api/messages');
  const data = await res.json();
  const list = document.getElementById('list');
  if (data.length === 0) {
    list.innerHTML = '<p class="empty">No whispers yet. Be the first to leave one.</p>';
    return;
  }
  list.innerHTML = data.map(m => `
    <div class="note">
      <div class="name">${m.name}</div>
      <div class="text">${m.text}</div>
      <div class="time">${m.time}</div>
    </div>
  `).join('');
}

async function sendMsg() {
  const nameEl = document.getElementById('name');
  const textEl = document.getElementById('text');
  const err = document.getElementById('err');
  const name = nameEl.value.trim();
  const text = textEl.value.trim();

  if (!name || !text) {
    err.style.display = 'block';
    return;
  }
  err.style.display = 'none';

  await fetch('/api/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, text })
  });

  nameEl.value = '';
  textEl.value = '';
  loadMsgs();
}

loadMsgs();
</script>
</body>
</html>
